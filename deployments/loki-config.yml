auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Диск дүүрэхээс сэргийлж 30 хоногийн дараа хуучин логийг автоматаар устгана.
limits_config:
  retention_period: 720h
  # Grafana Logs Drilldown (grafana-lokiexplore-app)-ийн лог хэмжээний
  # график/breakdown энэ index/volume API-г ашигладаг — өгөөгүй бол
  # "Log volume has not been configured" гэж харагдана.
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
