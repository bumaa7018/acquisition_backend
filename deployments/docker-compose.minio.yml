version: "3.9"

# ФАЙЛЫН СИСТЕМ (MinIO) — системд оруулсан БҮХ файл (баримт, зураг, тайлан,
# дроны ортофото) эндээ хадгалагдана. API файлыг өөр дээрээ хадгалахгүй,
# зөвхөн object-ийн замыг (file_url) DB-д бичнэ.
#
# ЯАГААД ТУСДАА ФАЙЛ:
#   1. Зөвхөн `scripts/deploy.sh`-ээр асна. `docker compose -f
#      deployments/docker-compose.yml up` гэж гараар дуудахад MinIO хөндөгдөхгүй.
#   2. Хасахад хялбар: ЭНЭ ФАЙЛЫГ УСТГАХАД болно. deploy.sh нь файл байгаа
#      эсэхийг шалгадаг тул дараагийн deploy-д MinIO нь `--remove-orphans`-аар
#      цэвэрлэгдэж, api-гийн `depends_on` болон S3 тохиргоо мөн арилна
#      (compose нь -f файлуудын depends_on/environment-ыг нэмэлтээр нэгтгэдэг).
#      Тэр үед файлын хадгалалтыг .env-ээр өөр зүг чиглүүлэх шаардлагатай —
#      эс бөгөөс API асахдаа хадгалалт бэлдэж чадалгүй зогсоно.
#
# АНХААР: `--remove-orphans`-тай `up` дуудлагад ЭНЭ файл хамт байх ёстой.
# Байхгүй бол compose нь ажиллаж байгаа minio-г "orphan" гэж үзэн УСТГАНА
# (docker-compose.logging.yml-тай ижил байдал — deploy.sh дээр тайлбарласан).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Ulaanbaatar
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Local/dev дээр presigned upload болон S3 шалгалтууд `localhost:9000`
    # руу шууд ханддаг тул S3 API-г зөвхөн loopback дээр нээнэ. 0.0.0.0 дээр
    # нийтлэхгүй тул сүлжээний гаднаас шууд харагдахгүй.
    #
    # Консол (9001) мөн зөвхөн localhost-д — ops SSH tunnel-ээр хандана.
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: on-failure
    logging: *default-logging
    networks:
      - gov_network

  # api-гийн файлын системтэй холбоотой тохиргоо — MinIO-той ХАМТ нэг файлд
  # байлгаснаар хасахад бүхэлдээ арилна.
  api:
    environment:
      FILE_SERVER_MODE: s3
      FILE_SERVER_BASE_URL: /api/files
      # gov_network дээрх "minio" сервис. Эдгээрийг ЭНД зааж байгаа нь
      # санамсаргүй биш: env_file (../.env) нь host дээр ажиллуулах (air)
      # локал утга агуулдаг тул container дотор буруу болно. compose-ийн
      # `environment:` нь `env_file:`-ээс дээгүүр приоритеттэй.
      S3_ENDPOINT: minio:9000
      # GeoServer мөн ЯГ ЭНЭ хаягаар растрыг Range хүсэлтээр уншина (нэг
      # сүлжээнд байгаа тул тусад нь заах шаардлагагүй).
      S3_GEOSERVER_ENDPOINT: http://minio:9000
      # minio сервистэй ижил хэрэглэгч/нууц үг — зөрөхөөс сэргийлж нэг эх сурвалж
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Presigned URL нь ЭНЭ хаягаар (minio:9000) зурагдана. Browser тэр
      # хаяг руу ШУУД хандахгүй — frontend-ийн /api/files proxy (Next server)
      # дамжуулна. Иймд MinIO-ийн портыг гадаад сүлжээнд нээх, CORS тохируулах
      # шаардлагагүй.
      #
      # АНХААР: гарын үсэг Host-ыг хамардаг тул frontend-ийн NEXT_S3_ENDPOINT
      # нь ЭНЭ S3_ENDPOINT-той ИЖИЛ байх ёстой. Зөрвөл MinIO нь
      # SignatureDoesNotMatch (403) буцаана.
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:

networks:
  gov_network:
    name: gov_network
    external: true
