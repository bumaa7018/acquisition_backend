version: "3.9"

# Docker-ийн анхдагч json-file logging driver файлын хэмжээнд ХЯЗГААРГҮЙ —
# удаан хугацаанд container stdout/stderr лог хязгааргүй хуримтлагдаж диск
# дүүрэх шалтгаан болдог. Тиймээс сервис бүрт rotation тохируулна (10MB × 3 файл).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:16-3.4
    env_file:
      - ../.env
    environment:
      TZ: Asia/Ulaanbaatar
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appdb}
      AUTHDB_NAME: ${AUTH_DB_NAME:-authdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-appdb} && pg_isready -U ${DB_USER:-postgres} -d ${AUTH_DB_NAME:-authdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    networks:
      - gov_network

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    env_file:
      - ../.env
    environment:
      TZ: Asia/Ulaanbaatar
      DB_HOST: postgres
      DB_PORT: 5432
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: 5432
      # Backend container-аас middleware container рүү gov_network дотор хандана.
      MIDDLEWARE_BASE_URL: http://goverment-middleware:8081
      # GeoServer нь gov_network дээрх "geoserver" сервис
      GEOSERVER_URL: http://geoserver:8080/geoserver
    # volumes БАЙХГҮЙ: backend ямар ч файл хадгалахгүй. Дроны ортофотог
    # GeoServer файлын системээс (MinIO) HTTP Range-ээр ШУУД уншина, иймд
    # хуваалцсан хавтас ч, рендерийн кэш ч шаардлагагүй.
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT:-8080}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: on-failure
    logging: *default-logging
    networks:
      - gov_network

volumes:
  postgres_data:

networks:
  gov_network:
    name: gov_network
    external: true
