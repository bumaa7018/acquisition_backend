version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appdb}
      AUTHDB_NAME: ${AUTH_DB_NAME:-authdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-appdb} && pg_isready -U ${DB_USER:-postgres} -d ${AUTH_DB_NAME:-authdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - gov_network

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: 5432
    ports:
      - "${APP_PORT:-8081}:${APP_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - gov_network

volumes:
  postgres_data:

networks:
  gov_network:
    name: gov_network
    external: true
