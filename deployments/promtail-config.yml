server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Docker socket-оор бүх контейнерийн лог (api, frontend, postgres, geoserver г.м.)
# автоматаар илрүүлж tail хийнэ — шинэ контейнер нэмэгдэхэд тохиргоо засах шаардлагагүй.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container_name"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "logstream"
      # docker-compose.yml дэх сервисийн НЭР (жишээ нь "api", "postgres",
      # "frontend", "geoserver") — container_name-ээс богино, ойлгомжтой тул
      # Grafana-ийн Explore/Builder горимын dropdown-д сонгоход хялбар.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      # Аль compose төслөөс (deployments / government-frontend / government-geoserver)
      # ирснийг ялгах — ижил нэртэй сервис олон төсөлд давхацвал шүүхэд хэрэгтэй.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
